services:
  postgres:
    image: postgres:16-alpine
    container_name: uatx_wechat_postgres
    environment:
      POSTGRES_USER: uatx
      POSTGRES_PASSWORD: uatx_dev
      POSTGRES_DB: uatx_wechat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uatx -d uatx_wechat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
